# Caller for the golatam/seo-tracker reusable workflow.
# Pinned to a known-good commit (not @main) since 2026-08-03: seo-tracker's
# main is about to default RANK_SOURCE to 'topvisor', and firmalo has no
# Topvisor secrets. Un-pin once seo-tracker exposes an explicit rank_source
# input (or once firmalo gets its own Topvisor project) and re-check.

name: SEO Weekly Position Check

on:
  # 2026-08-04: cron commented out, not deleted. Firmalo now has its own
  # Topvisor project (registered in golatam/seo-tracker) with a weekly cron
  # running from the Hermes VPS instead — this legacy caller would duplicate
  # the GSC-based check. workflow_dispatch stays for manual debugging/parity
  # checks. Keep this file for at least a month before deleting.
  # schedule:
  #   # Every Monday at 12:00 UTC (9:00 AM LATAM / 15:00 MSK)
  #   - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    uses: golatam/seo-tracker/.github/workflows/weekly-check.yml@ea69f34
    secrets: inherit
    with:
      site_url: https://firmalo.io
      site_property: sc-domain:firmalo.io
      notifier: telegram
      enable_yandex: false
      core_path: seo-tracking/semantic-core.json
      snapshots_dir: seo-tracking/snapshots
      package_ref: ea69f34
