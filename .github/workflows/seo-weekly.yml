# Caller for the golatam/seo-tracker reusable workflow.
# Tracks @main (canary) until both consumers are stable, then switches to @v1.

name: SEO Weekly Position Check

on:
  schedule:
    # Every Monday at 12:00 UTC (9:00 AM LATAM / 15:00 MSK)
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    uses: golatam/seo-tracker/.github/workflows/weekly-check.yml@main
    secrets: inherit
    with:
      site_url: https://firmalo.io
      site_property: sc-domain:firmalo.io
      notifier: telegram
      enable_yandex: false
      core_path: seo-tracking/semantic-core.json
      snapshots_dir: seo-tracking/snapshots
      package_ref: main
